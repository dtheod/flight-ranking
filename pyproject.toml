
[project]
name = "flight_ranking_recommendation"
version = "0.1.0"
description = ""
authors = [
    { name = "Danis Theodoulou" }
]
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "polars>=1.35.2",
    "altair>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pdoc3>=0.11.6",
    "pytest>=8.3.5",
    "pre-commit>=4.2.0"
]


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

ignore = [
    "E501",  # line too long, handled by formatter
]


[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Use tabs for indentation
indent-style = "tab"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
